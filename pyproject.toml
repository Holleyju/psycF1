[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1_pipeline"
version = "0.1.0"
description = "Pit stop analysis pipeline for Formula 1 data"
requires-python = ">=3.11"
dependencies = ["pandas"]

[tool.setuptools.packages.find]
where = ["."]
include = ["f1_pipeline*"]
